device:
  hostname: ServicesA
  device_type: cisco_ios
  management_ipv4: 172.16.10.4
  management_ipv6: 2001:DB8:200:10::4
  username: admin
vlans:
  - id: 10
    name: Management
  - id: 50
    name: Servers
  - id: 90
    name: Unused
  - id: 100
    name: Native
ipv6_unicast_routing: true
interfaces:
  SVIs:
    - name: "vlan 10"
      shutdown: false
      ipv4:
        address: 172.16.10.4
        mask: 255.255.255.0
        gateway: 172.16.10.3
      ipv6:
        address: 2001:DB8:200:10::4
        prefix: 64
    - name: "vlan 1"
      shutdown: true
  access:
    - name: Ethernet0/0
      vlan: 50
    - name: Ethernet0/2
      vlan: 50
    - name: Ethernet0/3
      vlan: 50
  trunk:
    - name: Ethernet1/0
      allowed_vlans: "10,50,100"
      native_vlan: 100
    - name: Ethernet1/1
      allowed_vlans: "10,50,100"
      native_vlan: 100
  unused_interfaces:
    range: "Ethernet0/1, 1/2 - 3/3"
    vlan: 90
    shutdown: true
spanning_tree:
  mode: rapid-pvst
  access_ports:
    portfast: true
    bpduguard: true
security:
  service_password_encryption: true
  banner: "Unauthorized access prohibited"
  console:
    exec_timeout:
      minutes: 5
      seconds: 0
  vty:
    exec_timeout:
      minutes: 5
      seconds: 0
  login_block:
    attempts: 3
    within_seconds: 60
    block_seconds: 120
time:
  timezone: UTC
  offset_hours: 2
  ntp_server_ipv4: 172.16.50.24
  ntp_server_ipv6: 2001:DB8:200:50::24
  clock_source: ntp
