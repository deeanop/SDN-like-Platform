device:
  hostname: SW-WAN1
  management_ipv4: 10.9.10.4
  management_ipv6: 2001:DB8:D1:10::4
  username: admin
management:
  vlan: 10
  ipv4:
    address: 10.9.10.4
    mask: 255.255.255.0
  ipv6:
    address: 2001:DB8:D1:10::4
    prefix: 64
vlans:
  - id: 10
    name: Management
  - id: 90
    name: Unused
unused_ports:
  range: "Ethernet0/3 - 3/3"
  switchport_mode: access
  shutdown: true
security:
  service_password_encryption: true
  banner: "Unauthorized access prohibited"
  console:
    exec_timeout:
      minutes: 5
      seconds: 0
  vty:
    exec_timeout:
      minutes: 5
      seconds: 0
  login_block:
    attempts: 3
    within_seconds: 60
    block_seconds: 120
time:
  timezone: UTC
  offset_hours: 2
  ntp_server_ipv4: 172.16.50.24
  ntp_server_ipv6: 2001:DB8:200:50::24
  clock_source: ntp

