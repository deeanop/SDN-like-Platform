device:
  hostname: C2
  device_type: cisco_ios
  management_ipv4: 10.15.10.2
  management_ipv6: 2001:DB8:C5:10::2
  username: admin
ipv6_unicast_routing: true
interfaces:
  loopbacks:
    - name: "Loopback0"
      description: "Loopback management interface"
      ipv4:
        address: 10.15.10.2
        mask: 255.255.255.0
      ipv6:
        address: 2001:DB8:C5:10::2
        prefix: 64
  unused_interfaces:
    Ethernet:
      range: "Ethernet0/2 - 1/3"
    Serial:
      range: "Serial2/0 - 3/3"
    shutdown: true
security:
  service_password_encryption: true
  banner: "Unauthorized access prohibited"
  console:
    exec_timeout:
      minutes: 5
      seconds: 0
  vty:
    exec_timeout:
      minutes: 5
      seconds: 0
  login_block:
    within_seconds: 60
    block_seconds: 120
time:
  timezone: UTC
  offset_hours: 2
  ntp_server_ipv4: 172.16.50.24
  ntp_server_ipv6: 2001:DB8:200:50::24
  clock_source: ntp
