device:
  hostname: C3
  device_type: cisco_ios
  username: admin
ipv6_unicast_routing: true
unused_ports:
  Ethernet:
    - "Ethernet0/3"
    - "Ethernet1/0"
    - "Ethernet1/1"
    - "Ethernet1/2"
    - "Ethernet1/3"
  Serial:
    - "Serial2/0"
    - "Serial2/1"
    - "Serial2/2"
    - "Serial2/3"
    - "Serial3/0"
    - "Serial3/1"
    - "Serial3/2"
    - "Serial3/3"
  shutdown: true
static_routes:
  ipv4:
    - destination: 172.16.10.0
      mask: 255.255.255.0
      next_hop: 10.10.10.5
    - destination: 172.16.20.0
      mask: 255.255.255.0
      next_hop: 10.10.10.5
    - destination: 172.16.30.0
      mask: 255.255.255.0
      next_hop: 10.10.10.5
    - destination: 172.16.40.0
      mask: 255.255.255.0
      next_hop: 10.10.10.5
    - destination: 192.168.10.0
      mask: 255.255.255.0
      next_hop: 10.12.10.1
    - destination: 192.168.20.0
      mask: 255.255.255.0
      next_hop: 10.13.10.2
    - destination: 192.168.30.0
      mask: 255.255.255.0
      next_hop: 10.12.10.1
    - destination: 192.168.40.0
      mask: 255.255.255.0
      next_hop: 10.13.10.2
  ipv6:
    - destination: 2001:DB8:200:10::/64
      next_hop: 2001:DB8:D1:10::5
    - destination: 2001:DB8:200:20::/64
      next_hop: 2001:DB8:D1:10::5
    - destination: 2001:DB8:200:30::/64
      next_hop: 2001:DB8:D1:10::5
    - destination: 2001:DB8:200:40::/64
      next_hop: 2001:DB8:D1:10::5
    - destination: 2001:DB8:100:10::/64
      next_hop: 2001:DB8:C2:10::1
    - destination: 2001:DB8:100:20::/64
      next_hop: 2001:DB8:C3:10::2
    - destination: 2001:DB8:100:30::/64
      next_hop: 2001:DB8:C2:10::1
    - destination: 2001:DB8:100:40::/64
      next_hop: 2001:DB8:C3:10::2
security:
  service_password_encryption: true
  banner: "Unauthorized access prohibited"
  console:
    exec_timeout:
      minutes: 5
      seconds: 0
  vty:
    minutes: 5
    seconds: 0
  login_block:
    attempts: 3
    within_seconds: 60
    block_seconds: 120
time:
  timezone: UTC
  offset_hours: 2
  ntp_server_ipv4: 172.16.50.24
  ntp_server_ipv6: 2001:DB8:200:50::24
  clock_source: ntp


