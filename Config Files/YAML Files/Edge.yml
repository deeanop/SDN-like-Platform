device:
  hostname: Edge
  device_type: cisco_ios
  username: admin
  management_ipv4: 172.17.10.4
  management_ipv6: 2001:DB8:300:10::4
management:
  ipv4:
    address: 172.17.10.4
    mask: 255.255.255.0
  ipv6:
    address: 2001:DB8:300:10::4
    prefix: 64
ipv6_unicast_routing: true
interfaces:
  loopbacks:
    - name: Loopback0
      description: "Loopback management interface"
      ipv4:
        address: 172.16.10.4
        mask: 255.255.255.0
      ipv6:
        address: 2001:DB8:400:10::4
        prefix: 64
  Ethernet:
    - name: Ethernet0/0
      shutdown: false
      description: "Towards Firewall"
      ipv4:
        address: 172.17.10.2
        mask: 255.255.255.0
      ipv6:
        address: 2001:DB8:300:10::2
        prefix: 64
    - name: Ethernet0/1
      shutdown: false
      description: "Towards Outside"
      ipv4:
        address: 10.17.80.1
        mask: 255.255.255.0
      ipv6:
        address: 2001:DB8:A1:80::1
        prefix: 64
    - name: Ethernet0/2
      shutdown: false
      description: "Towards Attacker"
      ipv4:
        address: 10.16.70.1
        mask: 255.255.255.0
      ipv6:
        address: 2001:DB8:A0:70::1
        prefix: 64
  unused_interfaces:
    Ethernet:
      range: "Ethernet0/3 - 1/3"
    Serial:
      range: "Serial2/0 - 3/3"
    shutdown: true
security:
  service_password_encryption: true
  banner: "Unauthorized access prohibited"
  console:
    exec_timeout:
      minutes: 5
      seconds: 0
  vty:
    exec_timeout:
      minutes: 5
      seconds: 0
  login_block:
    attempts: 3
    within_seconds: 60
    block_seconds: 120
time:
  timezone: UTC
  offset_hours: 2
  ntp_server_ipv4: 172.16.50.24
  ntp_server_ipv6: 2001:DB8:200:50::24
  clock_source: ntp



