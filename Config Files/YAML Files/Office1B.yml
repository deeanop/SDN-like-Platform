device:
  hostname: Office1B
  device_type: cisco_ios
  management_ipv4: 192.168.10.5
  management_ipv6: 2001:DB8:100:10::5
  username: admin
vlans:
  - id: 10
    name: Management
  - id: 20
    name: Customer
  - id: 30
    name: Voice
  - id: 40
    name: Printers
  - id: 90
    name: Unused
  - id: 100
    name: Native
ipv6_unicast_routing: true
interfaces:
  SVIs:
    - name: "vlan 10"
      shutdown: false
      ipv4:
        address: 192.168.10.5
        mask: 255.255.255.0
        gateway: 192.168.10.3
      ipv6:
        address: 2001:DB8:100:10::5
        prefix: 64
    - name: "vlan 1"
      shutdown: true
  access:
    - name: Ethernet0/0
      vlan: 30
      ip_source_guard: true
      port_security:
        enabled: true
        mode: dynamic
        maximum: 3
        violation: shutdown
    - name: Ethernet0/1
      vlan: 40
      ip_source_guard: true
      mac_address: 02:42:b7:7f:49:01
      ipv4_address: 192.168.40.21
      port_security:
        enabled: true
        mode: dynamic
        maximum: 3
        violation: shutdown
    - name: Ethernet0/2
      vlan: 20
      ip_source_guard: true
      mac_address: 02:42:13:ba:a5:01
      ipv4_address: 192.168.20.21
      port_security:
        enabled: true
        mode: dynamic
        maximum: 3
        violation: shutdown
  trunk:
    - name: Ethernet0/3
      allowed_vlans: [10,20,30,40,100]
      native_vlan: 100
      dhcp_snooping_trust: true
      dynamic_arp_inspection_trust: true
    - name: Ethernet1/0
      allowed_vlans: [10,20,30,40,100]
      native_vlan: 100
      dhcp_snooping_trust: true
      dynamic_arp_inspection_trust: true
  unused_interfaces:
    range: "Ethernet1/1 - 3/3"
    vlan: 90
    shutdown: true
spanning_tree:
  mode: rapid-pvst
  access_ports:
    portfast: true
    bpduguard: true
security:
  service_password_encryption: true
  banner: "Unauthorized access prohibited"
  console:
    exec_timeout:
      minutes: 5
      seconds: 0
  vty:
    exec_timeout:
      minutes: 5
      seconds: 0
  login_block:
    attempts: 3
    within_seconds: 60
    block_seconds: 120
  layer_2:
    port_security:
      enabled: true
      violation: shutdown
    dhcp_snooping:
      enabled: true
      vlans: [10,20,30,40]
    dynamic_arp_inspection:
      enabled: true
      vlans: [10,20,30,40]
    ip_source_guard:
      enabled: true
      mode: ip
time:
  timezone: UTC
  offset_hours: 2
  ntp_server_ipv4: 172.16.50.24
  ntp_server_ipv6: 2001:DB8:200:50::24
  clock_source: ntp

