device:
  hostname: Office4B
  device_type: cisco_ios
  management_ipv4: 192.168.10.11
  management_ipv6: 2001:DB8:100:10::11
  username: admin
vlans:
  - id: 10
    name: Management
  - id: 20
    name: Customer
  - id: 30
    name: Voice
  - id: 40
    name: Printers
  - id: 90
    name: Unused
  - id: 100
    name: Native
ipv6_unicast_routing: true
interfaces:
  SVIs:
    - name: "vlan 10"
      shutdown: false
      ipv4:
        address: 192.168.10.11
        mask: 255.255.255.0
        gateway: 192.168.10.3
      ipv6:
        address: 2001:DB8:100:10::11
        prefix: 64
    - name: "vlan 1"
      shutdown: true
  access:
    - name: Ethernet0/0
      vlan: 30
    - name: Ethernet0/1
      vlan: 40
    - name: Ethernet0/2
      vlan: 20
  trunk:
    - name: Ethernet0/3
      allowed_vlans: "10,20,30,40,100"
      native_vlan: 100
    - name: Ethernet1/0
      allowed_vlans: "10,20,30,40,100"
      native_vlan: 100
  unused_interfaces:
    range: "Ethernet1/1 - 3/3"
    vlan: 90
    shutdown: true
spanning_tree:
  mode: rapid-pvst
  access_ports:
    portfast: true
    bpduguard: true
security:
  service_password_encryption: true
  banner: "Unauthorized access prohibited"
  console:
    exec_timeout:
      minutes: 5
      seconds: 0
  vty:
    exec_timeout:
      minutes: 5
      seconds: 0
  login_block:
    attempts: 3
    within_seconds: 60
    block_seconds: 120
time:
  timezone: UTC
  offset_hours: 2
  ntp_server_ipv4: 172.16.50.24
  ntp_server_ipv6: 2001:DB8:200:50::24
  clock_source: ntp

