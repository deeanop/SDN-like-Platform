device:
  hostname: Core-SW2
  device_type: cisco_ios
  management_ipv4: 172.16.10.2
  management_ipv6: 2001:DB8:200:10::2
  username: admin
vlans:
  - id: 10
    name: Management
  - id: 50
    name: Servers
  - id: 90
    name: Unused
  - id: 100
    name: Native
ipv6_unicast_routing: true
interfaces:
  SVIs:
    - name: "vlan 10"
      shutdown: false
      ipv4:
        address: 172.16.10.2
        mask: 255.255.255.0
      ipv6:
        address: 2001:DB8:200:10::2
        prefix: 64
      standby:
        version: 2
        groups:
          - id: 10
            ipv4: 172.16.10.3
            ipv6: None
            priority: 110
            preempt: false
          - id: 11
            ipv4: None
            ipv6: 2001:DB8:200:10::3
            priority: 110
            preempt: false
    - name: "vlan 50"
      shutdown: false
      ipv4:
        address: 172.16.50.2
        mask: 255.255.255.0
      ipv6:
        address: 2001:DB8:200:50::2
        prefix: 64
      standby:
        version: 2
        groups:
          - id: 50
            ipv4: 172.16.50.3
            ipv6: None
            priority: 160
            preempt: true
          - id: 51
            ipv4: None
            ipv6: 2001:DB8:200:50::3
            priority: 160
            preempt: true
  no_switchport:
    - name: Ethernet0/0
      shutdown: false
      description: "Towards WAN2"
      ipv4:
        address: 10.10.10.2
        mask: 255.255.255.0
      ipv6:
        address: 2001:DB8:D2:10::2
        prefix: 64
      standby:
        version: 2
        groups:
          - id: 10
            ipv4: 10.10.10.5
            ipv6: None
            priority: 110
            preempt: false
          - id: 11
            ipv4: None
            ipv6: 2001:DB8:D2:10::5
            priority: 110
            preempt: false
    - name: Ethernet1/3
      shutdown: false
      description: "Towards ISP"
      ipv4:
        address: 10.15.1.1
        mask: 255.255.255.0
      ipv6:
        address: 2001:DB8:DD:1::1
        prefix: 64
    - name: Ethernet2/0
      shutdown: false
      description: "Mirror"
etherchannels:
  - group: 8
    protocol: lacp
    mode: passive
    interfaces:
      - Ethernet0/1
      - Ethernet0/2
    port_channel: Port-channel8
    switchport_mode: trunk
    allowed_vlans: "10,50,100"
    native_vlan: 100
  - group: 6
    protocol: lacp
    mode: passive
    interfaces:
      - Ethernet1/1
      - Ethernet1/2
    port_channel: Port-channel6
    switchport_mode: trunk
    allowed_vlans: "10,50,100"
    native_vlan: 100
unused_ports:
  range: "Ethernet0/3 - 1/0, 1/3 - 3/3"
  vlan: 90
  shutdown: true
spanning_tree:
  mode: rapid-pvst
  root:
    - role: primary
      vlans: 50
    - role: secondary
      vlans: 10
security:
  service_password_encryption: true
  banner: "Unauthorized acccess prohibited"
  console:
    exec_timeout:
      minutes: 5
      seconds: 0
  vty:
    exec_timeout:
      minutes: 5
      seconds: 0
  login_block:
    attempts: 3
    within_seconds: 60
    block_seconds: 120
time:
  timezone: UTC
  offset_hours: 2
  ntp_server_ipv4: 172.16.50.24
  ntp_server_ipv6: 2001:DB8:200:50::24
  clock_source: ntp

