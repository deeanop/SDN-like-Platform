device:
  hostname: DMZSwitch
  username: admin
  device_type: cisco_ios
  management_ipv4: 172.18.10.2
  management_ipv6: 2001:DB8:400:10::2
vlans:
  - id: 10
    name: Management
  - id: 60
    name: DMZ
  - id: 90
    name: Unused
  - id: 100
    name: Native
ipv6_unicast_routing: true
interfaces:
  SVIs:
    - name: "vlan 10"
      shutdown: false
      ipv4:
        address: 172.18.10.2
        mask: 255.255.255.0
        gateway: 172.18.10.1
      ipv6:
        address: 2001:DB8:400:10::2
        prefix: 64
  access:
    - name: Ethernet0/1
      vlan: 60
      ip_source_guard: true
      port_security:
        enabled: true
        mode: static
        maximum: 1
        mac_address: 02:42:2a:2c:81:00
        violation: shutdown
    - name: Ethernet0/2
      vlan: 60
      ip_source_guard: true
      port_security:
        enabled: true
        mode: static
        maximum: 1
        mac_address: 02:42:6c:f8:93:00
        violation: shutdown
    - name: Ethernet0/3
      vlan: 60
      ip_source_guard: true
      port_security:
        enabled: true
        mode: static
        maximum: 1
        mac_address: 02:42:0f:4e:84:00
        violation: shutdown
    - name: Ethernet1/0
      vlan: 60
      ip_source_guard: true
      port_security:
        enabled: true
        mode: static
        maximum: 1
        mac_address: 02:42:45:c5:06:00
        violation: shutdown
  trunk:
    - name: Ethernet0/0
      allowed_vlans: "10,60,100"
      native_vlan: 100
      dynamic_arp_inspection_trust: true
  unused_interfaces:
    - range: "Ethernet1/1 - 3/3"
      vlan: 90
      shutdown: true
security:
  service_password_encryption: true
  banner: "Unauthorized access prohibited"
  console:
    exec_timeout:
      minutes: 5
      seconds: 0
  vty:
    exec_timeout:
      minutes: 5
      seconds: 0
  login_block:
    attempts: 3
    within_seconds: 60
    block_seconds: 120
  layer_2:
    port_security:
      enabled: true
      violation: shutdown
    dynamic_arp_inspection:
      enabled: true
      vlans: "10,60"
    ip_source_guard:
      enabled: true
      mode: ip
time:
  timezone: UTC
  offset_hours: 2
  ntp_server_ipv4: 172.16.50.24
  ntp_server_ipv6: 2001:DB8:200:50::24
  clock_source: ntp
