device:
  hostname: C1
  device_type: cisco_ios
  management_ipv4: 10.15.10.1
  management_ipv6: 2001:DB8:C5:10::1
  username: admin
ipv6_unicast_routing: true
interfaces:
  loopbacks:
    - name: "Loopback0"
      description: "Loopback management interface"
      ipv4:
        address: 10.15.10.1
        mask: 255.255.255.0
      ipv6:
        address: 2001:DB8:C5:10::1
        prefix: 64
  unused_interfaces:
    Ethernet:
      range: "Ethernet0/3 - 1/3"
    Serial:
      range: "Serial2/0 - 3/3"
    shutdown: true
static_routes:
  ipv4:
    - destination: 192.168.10.0
      mask: 255.255.255.0
      next_hop: 10.9.10.5
    - destination: 192.168.20.0
      mask: 255.255.255.0
      next_hop: 10.9.10.5
    - destination: 192.168.30.0
      mask: 255.255.255.0
      next_hop: 10.9.10.5
    - destination: 192.168.40.0
      mask: 255.255.255.0
      next_hop: 10.9.10.5
    - destination: 172.16.10.0
      mask: 255.255.255.0
      next_hop: 10.11.10.2
    - destination: 172.16.50.0
      mask: 255.255.255.0
      next_hop: 10.14.10.2
  ipv6:
    - destination: 2001:DB8:100:10::/64
      next_hop: 2001:DB8:D1:10::5
    - destination: 2001:DB8:100:20::/64
      next_hop: 2001:DB8:D1:10::5
    - destination: 2001:DB8:100:30::/64
      next_hop: 2001:DB8:D1:10::5
    - destination: 2001:DB8:100:40::/64
      next_hop: 2001:DB8:D1:10::5
    - destination: 2001:DB8:200:10::/64
      next_hop: 2001:DB8:C1:10::2
    - destination: 2001:DB8:200:50::/64
      next_hop: 2001:DB8:C4:10::2
security:
  service_password_encryption: true
  banner: "Unauthorized access prohibited"
  console:
    exec_timeout:
      minutes: 5
      seconds: 0
  vty:
    minutes: 5
    seconds: 0
  login_block:
    attempts: 3
    within_seconds: 60
    block_seconds: 120
time:
  timezone: UTC
  offset_hours: 2
  ntp_server_ipv4: 172.16.50.24
  ntp_server_ipv6: 2001:DB8:200:50::24
  clock_source: ntp
